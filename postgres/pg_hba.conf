# Схема аутентификации для PostgreSQL в контейнере (без выноса порта 5432 наружу — доступ только из Docker-сети).
# LOCAL
local   all             all                                     peer
# IPv4 localhost
host    all             all             127.0.0.1/32            scram-sha-256
# IPv6 localhost
host    all             all             ::1/128                 scram-sha-256
# Остальные подключения по TCP — только SCRAM (типичная сеть Docker: bridge / overlay)
host    all             all             0.0.0.0/0               scram-sha-256
