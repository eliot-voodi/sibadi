services:
  db:
    image: postgres:18
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: ${DB_NAME:-university}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:-${DB_PASS:-password}}
      APP_DB_USER: ${DB_USER:-sibadi_app}
      APP_DB_PASSWORD: ${DB_PASS:-password}
    volumes:
      # PostgreSQL 18+: один том на /var/lib/postgresql (совместимость с pg_upgrade / новый layout данных)
      - pgdata:/var/lib/postgresql
      - ./postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
#    ports:
#      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-university}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-university}
      DB_USER: ${DB_USER:-sibadi_app}
      DB_PASS: ${DB_PASS:-password}
      PGSSLMODE: ${PGSSLMODE:-prefer}
      DB_SSLMODE: ${DB_SSLMODE:-}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
      DB_APPLICATION_NAME: ${DB_APPLICATION_NAME:-sibadi-web}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      SECRET_KEY: ${SECRET_KEY:-change_me}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-memory://}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-60 per minute}
      LOGIN_RATE_LIMIT_POST: ${LOGIN_RATE_LIMIT_POST:-12 per minute}
      LOGIN_BF_WINDOW_SEC: ${LOGIN_BF_WINDOW_SEC:-600}
      LOGIN_BF_MAX_ATTEMPTS: ${LOGIN_BF_MAX_ATTEMPTS:-8}
      LOGIN_BF_LOCKOUT_SEC: ${LOGIN_BF_LOCKOUT_SEC:-900}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_BOOTSTRAP_LOGIN: ${ADMIN_BOOTSTRAP_LOGIN:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}

  nginx:
    build: ./nginx
    depends_on:
      - web
    ports:
      - "443:443"
      - "80:80"
    environment:
      SSL_CN: ${SSL_CN:-localhost}
    volumes:
      - nginx_certs:/etc/nginx/certs

volumes:
  pgdata:
  nginx_certs:
